services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: empathy-sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "Password123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker/sql-init:/sql-init:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: /bin/bash /entrypoint.sh
    networks:
      - empathy-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Password123! -Q \"SELECT 1 FROM sys.databases WHERE name='EmpathySoupKitchen'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sqlserver_data:

networks:
  empathy-network:
    driver: bridge