name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # Applies infra/sql-setup.sql before the app deploys, so new code never
  # goes live against a database that is missing its tables.
  #
  # Only runs on merges to main, and only when something under infra/ changed
  # — an app-only merge skips the Azure deployment entirely.
  #
  # Auth is OIDC (no stored credentials). The SQL admin password is never
  # needed here: infra/parameters.json pulls it from Key Vault at deploy time.
  apply_schema_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Apply Database Schema
    permissions:
      id-token: write
      contents: read
    outputs:
      applied: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether infra changed
        id: changes
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          # First push to a branch reports an all-zero SHA; fall back to the parent commit.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo '')"
          fi

          if [ -z "$BEFORE" ]; then
            echo "No comparison point; applying schema to be safe."
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing $BEFORE..${{ github.sha }}"
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^infra/'; then
            echo "infra changed -> will apply schema"
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "no infra changes -> skipping schema deployment"
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Azure credentials are configured
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -euo pipefail
          missing=()
          [ -n "${{ vars.AZURE_CLIENT_ID }}" ]       || missing+=("AZURE_CLIENT_ID")
          [ -n "${{ vars.AZURE_TENANT_ID }}" ]       || missing+=("AZURE_TENANT_ID")
          [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] || missing+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### ❌ Schema deployment not configured"
              echo ""
              echo "This merge changed files under \`infra/\`, so the database schema needs to"
              echo "be applied — but these repository **variables** are not set:"
              echo ""
              for v in "${missing[@]}"; do echo "- \`$v\`"; done
              echo ""
              echo "Add them under **Settings → Secrets and variables → Actions → Variables**"
              echo "(the *Variables* tab, not Secrets). Setup commands are in the readme under"
              echo "\"CI setup for automatic schema deployment\"."
              echo ""
              echo "The app deploy is intentionally blocked: shipping code against a database"
              echo "that has not been migrated is worse than not shipping."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Missing repository variables: ${missing[*]} — see the job summary for setup steps."
            exit 1
          fi

          echo "Azure credentials configured."

      - name: Azure login (OIDC)
        if: steps.changes.outputs.infra == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply database configuration and schema
        if: steps.changes.outputs.infra == 'true'
        env:
          RG: empathy-soup-kitchen-web-app
        run: |
          set -euo pipefail

          # Deploy schema.bicep, NOT main.bicep. main.bicep redeploys the Static
          # Web App, Key Vault and Logic App, which is both unnecessary for a
          # schema change and fails preflight on Microsoft.Web/staticSites.
          # schema.bicep touches the database and nothing else.

          SQL_FQDN=$(az sql server list -g "$RG" --query "[0].fullyQualifiedDomainName" -o tsv)
          KV=$(az keyvault list -g "$RG" --query "[0].name" -o tsv)
          echo "SQL server: $SQL_FQDN"
          echo "Key Vault : $KV"

          if ! SQL_PW=$(az keyvault secret show --vault-name "$KV" --name sql-admin-password --query value -o tsv 2>/dev/null) || [ -z "$SQL_PW" ]; then
            {
              echo "### ❌ Cannot read the SQL password from Key Vault"
              echo ""
              echo "The deployment identity could not read \`sql-admin-password\` from \`$KV\`."
              echo "That vault uses **access policies**, not RBAC, so Contributor alone is not enough."
              echo ""
              echo "Grant it once:"
              echo ""
              echo '```bash'
              echo "az keyvault set-policy --name $KV \\"
              echo "  --spn \$AZURE_CLIENT_ID --secret-permissions get list"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Key Vault access denied for sql-admin-password — see the job summary."
            exit 1
          fi
          # Mask it so it can never surface in logs, even via a later error.
          echo "::add-mask::$SQL_PW"

          # Database configuration first — service tier, firewall, server settings —
          # so the schema is applied against the database as it should be. Like
          # schema.bicep, database.bicep declares no Microsoft.Web resources, so it
          # avoids the staticSites preflight failure that ruled out main.bicep.
          # A deployment that changes nothing is a no-op; a tier change drops
          # connections for a few seconds while it applies.
          SQL_SERVER_NAME=$(az sql server list -g "$RG" --query "[0].name" -o tsv)
          # Read the admin login off the server rather than assuming it: ARM
          # rejects a deployment that tries to change it.
          SQL_LOGIN=$(az sql server list -g "$RG" --query "[0].administratorLogin" -o tsv)
          LOCATION=$(az group show -n "$RG" --query location -o tsv)

          az deployment group create \
            --resource-group "$RG" \
            --template-file infra/database.bicep \
            --parameters location="$LOCATION" \
            --parameters sqlServerName="$SQL_SERVER_NAME" \
            --parameters sqlAdminLogin="$SQL_LOGIN" \
            --parameters sqlAdminPassword="$SQL_PW" \
            --name "database-${{ github.run_id }}" \
            --query 'properties.outputs.databaseName.value' \
            --output tsv

          az deployment group create \
            --resource-group "$RG" \
            --template-file infra/schema.bicep \
            --parameters sqlServerFqdn="$SQL_FQDN" \
            --parameters sqlAdminPassword="$SQL_PW" \
            --name "schema-${{ github.run_id }}" \
            --query 'properties.outputs.schemaTables.value' \
            --output json > tables.json

          echo "Deployment output:"
          cat tables.json

          {
            echo "### Database configuration and schema applied"
            echo ""
            echo "Tables now present:"
            echo ""
            jq -r '(. // []) | .[] | "- `\(.)`"' tables.json
          } >> "$GITHUB_STEP_SUMMARY"

  build_and_deploy_job:
    needs: [apply_schema_job]
    # always() so this still runs on pull_request events, where apply_schema_job
    # is skipped. On a push it will not run unless the schema job succeeded.
    if: |
      always() &&
      (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')) &&
      (needs.apply_schema_job.result == 'success' || needs.apply_schema_job.result == 'skipped')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_FOREST_0178A1E0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "dist/empathy-soup-kitchen-web-app/browser" # Built app content directory - optional
          data_api_location: "swa-db-connections" # Database connections config
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_FOREST_0178A1E0F }}
          action: "close"
          app_location: "/" # App source code path